apiVersion: batch/v1
kind: Job
metadata:
  name: dum-e-training
spec:
  backoffLimit: 0
  template:
    metadata:
      name: dum-e-training
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      - NVIDIA-A10
                      - NVIDIA-RTX-A5000
                      - NVIDIA-RTX-A6000
                      - NVIDIA-GeForce-RTX-3090
                      - NVIDIA-GeForce-RTX-4090
      containers:
        - name: dum-e-training
          image: vanshrai/dum_e_train:v1
          command: ["bash", "-c", "git pull origin main && python3 -m scripts.train 
            --train_batch_size=8 --freeze_vision_encoder=false --gradient_checkpointing=true"
          ]
          env:
            - name: WANDB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vrs-wandb-secret
                  key: api-key
          resources:
            requests:
              cpu: "4"
              memory: "32Gi"
              nvidia.com/gpu: 1
            limits:
              cpu: "4"
              memory: "32Gi"
              nvidia.com/gpu: 1
          volumeMounts:
          #   - name: data
          #     mountPath: /pvc
            - name: dshm
              mountPath: /dev/shm
      volumes:
        # - name: data
        #   persistentVolumeClaim:
        #     claimName: streamvln-pvc
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi